{% extends "base.html" %} {% block title %}Annotation Log{% endblock %} {% block
body %} {% include "header.html" %}

<div class="container">
  <div class="page-header">
    <h1>Annotation Log for Job {{ job_id }}</h1>
  </div>

  <div class="well">
    <pre style="border: none; background: transparent; white-space: pre-wrap">
{{ log_content }}</pre
    >
  </div>

  <hr />

  <a href="{{ url_for('annotation_details', id=job_id) }}"
    >&larr; back to annotation details</a
  >
</div>
<!-- container -->

{% endblock %}
